name: CI

# Security: Do not replace `pull_request` with `pull_request_target` to expose secrets or
# GITHUB_TOKEN write access to PR code. pull_request_target runs untrusted fork PR code with
# base-branch privileges.

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

env:
  CI: true
  TZ: UTC
  E2E_TEST: 1
  NODE_ENV: ci
  PGHOST: localhost
  PGUSER: postgres
  IMAGES_URL: http://localhost:3001
  API_URL: http://localhost:3060
  API_KEY: dvl-1510egmf4a23d80342403fb599qd
  API_FOLDER: /home/runner/work/opencollective-images/opencollective-images/opencollective-api
  IMAGES_FOLDER: /home/runner/work/opencollective-images/opencollective-images
  PG_DATABASE: opencollective_dvl

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'

      # Npm cache

      - name: Restore .npm cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-cache-${{ github.sha }}
          restore-keys: |
            - ${{ runner.os }}-npm-cache-${{ github.sha }}
            - ${{ runner.os }}-npm-cache-

      - name: Restore node_modules
        uses: actions/cache@v6
        id: node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit

      - run: npm run lint:quiet

  prettier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'

      # Npm cache

      - name: Restore .npm cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-cache-${{ github.sha }}
          restore-keys: |
            - ${{ runner.os }}-npm-cache-${{ github.sha }}
            - ${{ runner.os }}-npm-cache-

      - name: Restore node_modules
        uses: actions/cache@v6
        id: node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit

      - run: npm run prettier:check

  depcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'

      # Npm cache

      - name: Restore .npm cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-cache-${{ github.sha }}
          restore-keys: |
            - ${{ runner.os }}-npm-cache-${{ github.sha }}
            - ${{ runner.os }}-npm-cache-

      - name: Restore node_modules
        uses: actions/cache@v6
        id: node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit

      - run: npm run depcheck
  test:
    runs-on: ubuntu-26.04

    services:
      redis:
        image: valkey/valkey:9.1
        ports:
          - 6379:6379
        options: --entrypoint valkey-server
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      # Npm cache

      - name: Restore .npm cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-cache-${{ github.sha }}
          restore-keys: |
            - ${{ runner.os }}-npm-cache-${{ github.sha }}
            - ${{ runner.os }}-npm-cache-

      # Checkouts

      - name: Checkout (images)
        uses: actions/checkout@v7

      - name: Checkout (api)
        uses: actions/checkout@v7
        with:
          repository: opencollective/opencollective-api
          path: opencollective-api

      # Node and NPM

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'

      # Prepare API

      - name: Restore node_modules (api)
        uses: actions/cache@v6
        id: api-node-modules
        with:
          path: opencollective-api/node_modules
          key: ${{ runner.os }}-api-node-modules-${{ hashFiles('opencollective-api/package-lock.json') }}

      # api's postinstall would restore the DB with the runner's PostgreSQL 18 tools; the steps below restore and migrate it
      - name: Install dependencies (api)
        working-directory: opencollective-api
        if: steps.api-node-modules.outputs.cache-hit != 'true'
        env:
          SKIP_POSTINSTALL: 1
        run: npm ci --prefer-offline --no-audit

      - name: Build (api)
        working-directory: opencollective-api
        if: steps.api-build.outputs.cache-hit != 'true'
        run: npm run build

      # Prepare Images

      - name: Restore node_modules (images)
        uses: actions/cache@v6
        id: images-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-images-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (images)
        if: steps.images-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Build (images)
        run: npm run build

      # Prepare DB

      # Run pg_restore & co from the postgres:16 image: the ubuntu-26.04 runner ships PostgreSQL 18 client
      # tools, whose pg_restore emits `SET transaction_timeout` that a PostgreSQL 16 server rejects.
      - name: Restore DB
        working-directory: opencollective-api
        env:
          USE_DOCKER: true
        run: npm run db:restore

      - name: Migrate DB
        working-directory: opencollective-api
        run: npm run db:migrate

      # Run test

      - name: Run test
        run: ./scripts/run_test.sh
        env:
          # The cache provider tests run against the job's Redis service
          TEST_REDIS_URL: redis://localhost:6379/15
